<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofer Idels | Scholar</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1a365d;    /* Oxford Blue */
            --accent: #2c5282;     /* Lighter Blue */
            --text: #2d3748;       /* Soft Black body text */
            --light-bg: #fdfdfd;   /* Off-white background */
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background-color: var(--light-bg);
            margin: 0;
            line-height: 1.8;
        }

        /* High-end Serif Headings */
        h1, h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            margin-top: 0;
        }

        /* Clean, Sticky Navigation */
        nav {
            background: white;
            padding: 1.5rem 0;
            border-bottom: 1px solid #eee;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            margin: 0 20px;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        /* About Section Layout */
        .about-section {
            display: flex;
            align-items: flex-start;
            gap: 4rem;
        }

        .profile-pic {
            width: 220px;
            height: auto;
            border-radius: 8px; /* Modern slightly rounded corners */
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            background-color: #eee; /* Placeholder color before image loads */
        }

        .about-text h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }

        .about-text p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

            padding: 12px 28px;
            background: var(--primary);
